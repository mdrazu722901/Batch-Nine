<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.8.0/html2pdf.bundle.min.js" integrity="sha512-w3u9q/DeneCSwUDjhiMNibTRh/1i/gScBVp2imNVAMCt6cUHIw6xzhzcPFIaL3Q1EbI2l+nu17q2aLJJLo4ZYg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
    <div>
        <div id="formDiv">
             <div class="formSubDiv">
                <form>
                    <label for="name">Name:</label>
                    <input type="text" id="name" placeholder="Enter Your Name"><br><br>
                    <label for="phone">Phone:</label>
                    <input type="text" id="phone" type="number" placeholder="Enter Your Number"><br><br>
                    <label for="email">Email:</label>
                    <input type="text" id="email" type="email" placeholder="Enter Your Email"><br><br>
                </form>
                 <button id="submit">Submit</button>
             </div>
            
        </div>
        <div id="CollectDataDiv">
            <div id="collectData">
                <p>Your Name is: <span id="CollectName">to</span></p>
                <p>Your Phone is: <span id="CollectPhone">to</span></p>
                <p>Your Email is: <span id="CollectEmail">to</span></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
